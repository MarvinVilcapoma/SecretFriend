<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Amigo Secreto · Lista de deseos</title>
  <meta name="description" content="Escribe tu lista de deseos y mira lo que piden los demás.">
  <meta name="theme-color" content="#14532d">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <!-- Aplica el tema antes de pintar para que no parpadee en claro. -->
  <script>
    try {
      var t = localStorage.getItem('secret-friend.theme');
      if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#06170d');
      }
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
